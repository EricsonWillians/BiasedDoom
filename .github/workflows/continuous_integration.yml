name: Continuous Integration

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: ${{ matrix.config.name }} | ${{ matrix.config.build_type }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Visual Studio 2022
          os: windows-2022
          build_type: Release

        - name: Visual Studio 2022
          os: windows-2022
          build_type: Debug

        - name: macOS
          os: macos-14
          deps_cmdline: brew install autoconf autoconf-archive automake libtool libvpx molten-vk vulkan-volk
          build_type: Release

        - name: macOS
          os: macos-14
          extra_options: -G Xcode -DDYN_OPENAL=OFF
          deps_cmdline: brew install autoconf autoconf-archive automake libtool libvpx molten-vk vulkan-volk
          build_type: Debug

        - name: Linux GCC 9 # oldest version available
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=gcc-9 -DCMAKE_CXX_COMPILER=g++-9
          deps_cmdline: sudo apt-get update && sudo apt-get install gcc-9 g++-9 libsdl2-dev libvpx-dev libgtk2.0-dev libwebp-dev python3-dev
          build_type: RelWithDebInfo

        - name: Linux GCC 12 # last known good
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12
          deps_cmdline: sudo apt-get update && sudo apt-get install libsdl2-dev libvpx-dev libgtk-3-dev libwebp-dev python3-dev
          build_type: MinSizeRel
          export_appimage: true

        - name: Linux GCC Latest # rolling default, not actually latest
          os: ubuntu-latest
          extra_options: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          deps_cmdline: sudo apt-get update && sudo apt-get install libsdl2-dev libvpx-dev libwebp-dev python3-dev
          build_type: Release

        - name: Linux Clang 11 # oldest version available
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-11 -DCMAKE_CXX_COMPILER=clang++-11 -DDYN_OPENAL=OFF
          deps_cmdline: sudo apt-get update && sudo apt-get install clang-11 libsdl2-dev libvpx-dev libopenal-dev libwebp-dev python3-dev
          build_type: Debug

        - name: Linux Clang 15 # last known good
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-15 -DCMAKE_CXX_COMPILER=clang++-15
          deps_cmdline: sudo apt-get update && sudo apt-get install clang-15 libsdl2-dev libvpx-dev libwebp-dev python3-dev
          build_type: Release
          export_appimage: true

        - name: Linux Clang Latest # rolling default, not actually latest
          os: ubuntu-latest
          extra_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          deps_cmdline: sudo apt-get update && sudo apt-get install libsdl2-dev libvpx-dev libwebp-dev python3-dev
          build_type: Release

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      shell: bash
      run: |
        if [[ -n "${{ matrix.config.deps_cmdline }}" ]]; then
          eval ${{ matrix.config.deps_cmdline }}
        fi
        if [[ "${RUNNER_OS}" == "macOS" ]]; then
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "${GITHUB_PATH}"
        fi
        mkdir build

    - name: Ensure vcpkg checkout
      shell: bash
      run: |
        set -euo pipefail

        VCPKG_COMMIT="$(git ls-tree HEAD vcpkg | awk '{print $3}')"
        if [[ ! -d vcpkg/.git || ! -f vcpkg/scripts/buildsystems/vcpkg.cmake ]]; then
          rm -rf vcpkg
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          if [[ -n "${VCPKG_COMMIT}" ]]; then
            git -C vcpkg checkout "${VCPKG_COMMIT}"
          fi
        fi

    - name: Cache vcpkg build products
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/downloads
          vcpkg/buildtrees
          vcpkg/packages
          vcpkg_installed
        key: ${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.build_type }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.build_type }}-vcpkg-

    - name: Bootstrap vcpkg
      if: runner.os != 'Windows'
      shell: bash
      run: |
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

    - name: Bootstrap vcpkg
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

    - name: Git describe
      id: ghd
      uses: proudust/gh-describe@v2

    - name: Configure
      shell: bash
      run: |
        audio_options=()
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          audio_options+=(
            -DOPENAL_SOFT_VCPKG=ON
            -DDYN_OPENAL=OFF
            -DVCPKG_LIBSNDFILE=ON
            -DDYN_SNDFILE=OFF
            -DBIASEDDOOM_BUILD_AUDIO_TESTS=ON
          )
        fi

        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
          -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
          -DBIASEDDOOM_ENABLE_GLTF=ON \
          -DBIASEDDOOM_BUILD_GLTF=ON \
          -DBIASEDDOOM_ENABLE_PYTHON=ON \
          -DBIASEDDOOM_REQUIRE_PYTHON=ON \
          -DPK3_QUIET_ZIPDIR=ON \
          "${audio_options[@]}" \
          ${{ matrix.config.extra_options }}

    - name: Build
      shell: bash
      run: |
        export GIT_DESCRIBE="${{ steps.ghd.outputs.describe }}"
        export MAKEFLAGS=--keep-going
        cmake --build build --config ${{ matrix.config.build_type }} --parallel 3

    - name: Test engine-shipped Python framework contracts
      if: runner.os == 'Linux'
      shell: bash
      run: |
        python3 tools/test-framework-hotfixes.py

    - name: Test prediction rollback source contracts
      if: runner.os == 'Linux'
      shell: bash
      run: |
        python3 tools/test-prediction-rollback.py

    - name: Test bundled Windows audio
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        export ALSOFT_DRIVERS=null
        "./build/${{ matrix.config.build_type }}/biaseddoom-audio-probe.exe" \
          ./wadsrc/static/sounds/dsquake.ogg \
          ./wadsrc/static/sounds/dssecret.flac

    - name: Create Package
      shell: bash
      run: |
        cd build
        mkdir package
        if [[ "${{ runner.os }}" == 'Windows' ]]; then
          cp ${{ matrix.config.build_type }}/biaseddoom.exe ./${{ matrix.config.build_type }}/*.pk3 package
          cp ./${{ matrix.config.build_type }}/*.dll package || true
          cp -r ${{ matrix.config.build_type }}/soundfonts ${{ matrix.config.build_type }}/fm_banks ${{ matrix.config.build_type }}/python package || true
          test -f package/zmusic.dll
          if find package -maxdepth 1 -type f \( -iname 'openal*.dll' -o -iname '*sndfile*.dll' -o -iname '*mpg123*.dll' \) -print -quit | grep -q .; then
            echo "Windows package unexpectedly contains a loose OpenAL or decoder DLL"
            exit 1
          fi
        elif [[ "${{ runner.os }}" == 'macOS' ]]; then
          if [[ "${{ matrix.config.build_type }}" != 'Release' ]]; then
            mv ${{ matrix.config.build_type }}/biaseddoom.app biaseddoom.app
          fi
          cp -r biaseddoom.app package
        elif [[ "${{ runner.os }}" == 'Linux' ]]; then
          if [[ -n "${{ matrix.config.export_appimage }}" ]]; then
            mkdir AppDir
            cmake --install . --prefix "$(realpath AppDir)/usr"

            sudo apt-get install libfuse2 # renamed to libfuse2t64 in later releases
            wget -qO - https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage \
              | tee appimage-builder | sha1sum
            echo "6f83a789f6c47a745b97d1b0b3f1df2e7eea7a09 appimage-builder" | sha1sum -c -
            chmod +x appimage-builder

            export GIT_DESCRIBE="${{ steps.ghd.outputs.describe }}"
            ./appimage-builder --skip-tests --recipe ../tools/AppImageBuilder.yml

            appimages=(*.AppImage)
            if (( ${#appimages[@]} != 1 )); then
              echo "Expected exactly one generated AppImage, found ${#appimages[@]}"
              exit 1
            fi
            ../tools/check-appimage-deps.sh "${appimages[0]}"
            ../tools/smoke-appimage.sh "${appimages[0]}" ubuntu:22.04
            ../tools/smoke-appimage.sh "${appimages[0]}" ubuntu:20.04
            cp "${appimages[0]}" package
          else
            cp biaseddoom ./*.pk3 ./libzmusic.so* ./libpython*.so* package
            cp -r python package
          fi
        fi

        python_validation_root=package
        if [[ "${{ runner.os }}" == 'Linux' && -n "${{ matrix.config.export_appimage }}" ]]; then
          python_validation_root=AppDir
        fi
        if ! find "${python_validation_root}" \( -path '*/python/*/encodings/__init__.py' -o -path '*/python/Lib/encodings/__init__.py' \) | grep -q .; then
          echo "Embedded Python standard library is missing from package"
          exit 1
        fi
        if ! find "${python_validation_root}" -path '*/python/LICENSE.txt' -type f -print -quit | grep -q .; then
          echo "CPython license is missing from package"
          exit 1
        fi

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        path: build/package
        name: ${{ matrix.config.name }} ${{ matrix.config.build_type }}

    - name: List Build Directory
      if: always()
      shell: bash
      run: |
        git status
        ls -lR build

  windows-mingw:
    name: MinGW Windows x64 package
    # OpenAL Soft 1.25 requires the C++20 <format> implementation provided by
    # Noble's MinGW GCC 13 toolchain (Jammy ships MinGW GCC 10).
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          build-essential \
          cmake \
          g++-mingw-w64 \
          gcc-mingw-w64 \
          git \
          libglib2.0-dev \
          libgtk-3-dev \
          libsdl2-dev \
          libvpx-dev \
          libwebp-dev \
          mingw-w64 \
          nasm \
          ninja-build \
          pkg-config

    - name: Build Windows package with MinGW
      shell: bash
      run: |
        ./tools/build-windows-mingw.sh --package --jobs 3

    - name: Upload MinGW Package
      uses: actions/upload-artifact@v4
      with:
        path: |
          artifacts/BiasedDoom-*-Windows-x64-MinGW.zip
          artifacts/BiasedDoom-*-Windows-x64-MinGW.zip.sha256
        name: MinGW Windows x64 Release
        if-no-files-found: error
