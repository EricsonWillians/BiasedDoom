name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z). A matching git tag (vX.Y.Z) must exist."
        required: true
        type: string
      release_draft:
        description: "Publish this release as a draft."
        default: false
        required: false
        type: boolean
      release_prerelease:
        description: "Mark release as prerelease."
        default: false
        required: false
        type: boolean
      force_version_mismatch:
        description: "Continue even if the tagged src/version.h VERSIONSTR does not match this release version."
        default: false
        required: false
        type: boolean

concurrency:
  group: biaseddoom-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  APPIMAGE_BUILDER_URL: https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
  APPIMAGE_BUILDER_SHA1: 6f83a789f6c47a745b97d1b0b3f1df2e7eea7a09

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          DISPATCH_DRAFT: ${{ github.event.inputs.release_draft }}
          DISPATCH_PRERELEASE: ${{ github.event.inputs.release_prerelease }}
          DISPATCH_FORCE_MISMATCH: ${{ github.event.inputs.force_version_mismatch }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${DISPATCH_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "${VERSION}" || ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be X.Y.Z, for example 4.15.1."
            exit 1
          fi

          TAG="v${VERSION}"
          FORCE_MISMATCH="${DISPATCH_FORCE_MISMATCH:-false}"

          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} does not exist yet. Create and push it before running this release."
            exit 1
          fi

          FILE_VERSION="$(git show "${TAG}:src/version.h" | awk -F'"' '/^#define VERSIONSTR / {print $2; exit}')"
          if [[ -z "${FILE_VERSION}" ]]; then
            echo "::error::Could not read VERSIONSTR from src/version.h at ${TAG}."
            exit 1
          fi

          if [[ "${FILE_VERSION}" != "${VERSION}" && "${FORCE_MISMATCH}" != "true" ]]; then
            echo "::error::src/version.h VERSIONSTR at ${TAG} is ${FILE_VERSION}, but release version is ${VERSION}."
            echo "::error::Run tools/bump-version.sh --set ${VERSION}, commit, tag, and push again."
            exit 1
          fi
          if [[ "${FILE_VERSION}" != "${VERSION}" ]]; then
            echo "::warning::Version mismatch kept by force flag for this workflow run."
          fi

          if [[ "${DISPATCH_DRAFT:-false}" == "true" ]]; then
            DRAFT=true
          else
            DRAFT=false
          fi

          if [[ "${DISPATCH_PRERELEASE:-false}" == "true" ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "draft=${DRAFT}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

  build-and-package:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux-x86_64
          - os: windows-2022
            label: Windows-x64
          - os: macos-14
            label: macOS
    runs-on: ${{ matrix.os }}
    env:
      GIT_DESCRIBE: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            git \
            libglib2.0-dev \
            libgtk-3-dev \
            libsdl2-dev \
            libvpx-dev \
            libwebp-dev \
            libfuse2 \
            ninja-build \
            python3-dev \
            wget

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install --quiet autoconf autoconf-archive automake libtool libvpx webp molten-vk vulkan-volk
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "${GITHUB_PATH}"

      - name: Ensure vcpkg checkout
        shell: bash
        run: |
          set -euo pipefail

          VCPKG_COMMIT="$(git ls-tree HEAD vcpkg | awk '{print $3}')"
          if [[ ! -d vcpkg/.git || ! -f vcpkg/scripts/buildsystems/vcpkg.cmake ]]; then
            rm -rf vcpkg
            git clone https://github.com/microsoft/vcpkg.git vcpkg
            if [[ -n "${VCPKG_COMMIT}" ]]; then
              git -C vcpkg checkout "${VCPKG_COMMIT}"
            fi
          fi

      - name: Cache vcpkg build products
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
            vcpkg_installed
          key: ${{ runner.os }}-release-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-release-vcpkg-

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: bash
        run: |
          audio_options=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            audio_options+=(
              -DOPENAL_SOFT_VCPKG=ON
              -DDYN_OPENAL=OFF
              -DVCPKG_LIBSNDFILE=ON
              -DDYN_SNDFILE=OFF
              -DBIASEDDOOM_BUILD_AUDIO_TESTS=ON
            )
          fi

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DBIASEDDOOM_ENABLE_GLTF=ON \
            -DBIASEDDOOM_BUILD_GLTF=ON \
            -DBIASEDDOOM_ENABLE_PYTHON=ON \
            -DBIASEDDOOM_REQUIRE_PYTHON=ON \
            "${audio_options[@]}" \
            -DPK3_QUIET_ZIPDIR=ON

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 3

      - name: Test engine-shipped Python framework contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tools/test-framework-hotfixes.py

      - name: Test prediction rollback source contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tools/test-prediction-rollback.py

      - name: Test bundled Windows audio
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export ALSOFT_DRIVERS=null
          ./build/Release/biaseddoom-audio-probe.exe \
            ./wadsrc/static/sounds/dsquake.ogg \
            ./wadsrc/static/sounds/dssecret.flac

      - name: Package release asset
        id: package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          VERSION="${{ needs.prepare.outputs.version }}"
          LABEL="${{ matrix.label }}"
          REPO_DIR="$(pwd)"
          BUILD_DIR="${REPO_DIR}/build"
          OUTPUT_DIR="${REPO_DIR}/dist"
          PACKAGE_NAME="BiasedDoom-${VERSION}-${LABEL}"
          STAGING_DIR="${OUTPUT_DIR}/staging/${PACKAGE_NAME}"
          mkdir -p "${OUTPUT_DIR}" "${STAGING_DIR}"
          cp "${REPO_DIR}/TROUBLESHOOTING.md" "${STAGING_DIR}/"

          write_windows_readme() {
            {
              echo "BiasedDoom ${VERSION} for Windows x64"
              echo
              echo "Run biaseddoom.exe to start the engine. You still need a supported IWAD such as DOOM2.WAD."
              echo
              echo "Example:"
              echo '  biaseddoom.exe -iwad C:\Games\Doom\DOOM2.WAD'
              echo
              echo "Keep the PK3 files, DLLs, soundfonts, and fm_banks folders beside biaseddoom.exe."
              echo "Keep the python folder too. Python mods are trusted and require -python or py_enabled true."
              echo "OpenAL Soft and the compressed-audio codecs are built in; do not copy OpenAL or sndfile DLLs from another source port into this folder."
              echo
              echo "For a complete startup/audio report that exits after checking, run:"
              echo "  biaseddoom.exe -stdout -audiodiagnostics -norun"
              echo
              echo "The snd_status and snd_listdrivers console commands add backend and device details to that log."
              printf '%s\n' 'The automatic log is written to %LOCALAPPDATA%\biaseddoom\biaseddoom-audio.log, with a fallback beside biaseddoom.exe.'
              echo "Disconnected endpoints are reopened automatically; if Windows temporarily has no usable output, BiasedDoom keeps retrying with bounded backoff."
              echo "See TROUBLESHOOTING.md for IWAD, audio, mod, and build diagnostics."
            } > "${STAGING_DIR}/README-Windows.txt"
          }

          copy_runtime_files() {
            local source_dir="$1"
            local path

            for path in "${source_dir}"/*.pk3 "${source_dir}"/*.dll "${source_dir}"/*.dylib "${source_dir}"/libzmusic.so* "${source_dir}"/libpython*.so*; do
              if [[ -e "${path}" ]]; then
                cp -a "${path}" "${STAGING_DIR}/"
              fi
            done

            for path in "${source_dir}/soundfonts" "${source_dir}/fm_banks" "${source_dir}/python"; do
              if [[ -d "${path}" ]]; then
                cp -a "${path}" "${STAGING_DIR}/"
              fi
            done
          }

          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            rm -rf "${BUILD_DIR}/AppDir"
            cmake --install "${BUILD_DIR}" --config Release --prefix "${BUILD_DIR}/AppDir/usr"

            if ! find "${BUILD_DIR}/AppDir" -type f -path '*/python/lib/python*/encodings/__init__.py' -print -quit | grep -q .; then
              echo "::error::Linux AppDir is missing the embedded Python standard library."
              exit 1
            fi
            if ! find "${BUILD_DIR}/AppDir" -type f -name 'libpython*.so*' -print -quit | grep -q .; then
              echo "::error::Linux AppDir is missing the embedded CPython runtime library."
              exit 1
            fi
            if ! find "${BUILD_DIR}/AppDir" -type f -path '*/python/LICENSE.txt' -print -quit | grep -q .; then
              echo "::error::Linux AppDir is missing the CPython license."
              exit 1
            fi

            wget -qO "${BUILD_DIR}/appimage-builder" "${APPIMAGE_BUILDER_URL}"
            echo "${APPIMAGE_BUILDER_SHA1}  ${BUILD_DIR}/appimage-builder" | sha1sum -c -
            chmod +x "${BUILD_DIR}/appimage-builder"

            pushd "${BUILD_DIR}"
            ./appimage-builder --skip-tests --recipe ../tools/AppImageBuilder.yml
            popd

            appimages=("${BUILD_DIR}"/*.AppImage)
            if (( ${#appimages[@]} != 1 )); then
              echo "::error::Expected exactly one AppImage in ${BUILD_DIR}, found ${#appimages[@]}."
              exit 1
            fi
            "${REPO_DIR}/tools/check-appimage-deps.sh" "${appimages[0]}"
            "${REPO_DIR}/tools/smoke-appimage.sh" "${appimages[0]}" ubuntu:22.04
            "${REPO_DIR}/tools/smoke-appimage.sh" "${appimages[0]}" ubuntu:20.04

            ASSET_PATH="${OUTPUT_DIR}/${PACKAGE_NAME}.AppImage"
            cp "${appimages[0]}" "${ASSET_PATH}"
            chmod +x "${ASSET_PATH}"
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary_candidates=(
              "${BUILD_DIR}/Release/biaseddoom.exe"
              "${BUILD_DIR}/biaseddoom.exe"
            )
            BINARY=""
            for candidate in "${binary_candidates[@]}"; do
              if [[ -f "${candidate}" ]]; then
                BINARY="${candidate}"
                break
              fi
            done

            if [[ -z "${BINARY}" ]]; then
              echo "::error::Could not find biaseddoom.exe."
              find "${BUILD_DIR}" -maxdepth 3 -type f -name '*.exe' -print || true
              exit 1
            fi

            BINARY_DIR="$(dirname "${BINARY}")"
            cp "${BINARY}" "${STAGING_DIR}/"
            copy_runtime_files "${BINARY_DIR}"
            copy_runtime_files "${BUILD_DIR}"
            write_windows_readme

            if [[ ! -f "${STAGING_DIR}/biaseddoom.exe" ]]; then
              echo "::error::Windows package is missing biaseddoom.exe."
              exit 1
            fi
            if ! compgen -G "${STAGING_DIR}/*.pk3" >/dev/null; then
              echo "::error::Windows package is missing PK3 game resource files."
              exit 1
            fi
            if [[ ! -f "${STAGING_DIR}/zmusic.dll" ]]; then
              echo "::error::Windows package is missing zmusic.dll."
              exit 1
            fi
            if find "${STAGING_DIR}" -maxdepth 1 -type f \( -iname 'openal*.dll' -o -iname '*sndfile*.dll' -o -iname '*mpg123*.dll' \) -print -quit | grep -q .; then
              echo "::error::Windows package unexpectedly contains a loose OpenAL or decoder DLL."
              exit 1
            fi
            if [[ ! -f "${STAGING_DIR}/python/Lib/encodings/__init__.py" ]]; then
              echo "::error::Windows package is missing the embedded Python standard library."
              exit 1
            fi
            if [[ ! -f "${STAGING_DIR}/python/LICENSE.txt" ]]; then
              echo "::error::Windows package is missing the CPython license."
              exit 1
            fi

            ASSET_PATH="${OUTPUT_DIR}/${PACKAGE_NAME}.zip"
            pushd "${OUTPUT_DIR}/staging"
            cmake -E tar cf "${ASSET_PATH}" --format=zip "${PACKAGE_NAME}"
            popd
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            app_candidates=(
              "${BUILD_DIR}/Release/biaseddoom.app"
              "${BUILD_DIR}/biaseddoom.app"
            )
            APP=""
            for candidate in "${app_candidates[@]}"; do
              if [[ -d "${candidate}" ]]; then
                APP="${candidate}"
                break
              fi
            done

            if [[ -z "${APP}" ]]; then
              echo "::error::Could not find biaseddoom.app."
              find "${BUILD_DIR}" -maxdepth 3 -name '*.app' -print || true
              exit 1
            fi

            APP_DIR="$(dirname "${APP}")"
            cp -a "${APP}" "${STAGING_DIR}/"
            copy_runtime_files "${APP_DIR}"
            copy_runtime_files "${BUILD_DIR}"

            if ! find "${STAGING_DIR}" -type f -path '*/python/lib/python*/encodings/__init__.py' -print -quit | grep -q .; then
              echo "::error::macOS package is missing the embedded Python standard library."
              exit 1
            fi
            if ! find "${STAGING_DIR}" -type f -path '*/python/LICENSE.txt' -print -quit | grep -q .; then
              echo "::error::macOS package is missing the CPython license."
              exit 1
            fi

            ASSET_PATH="${OUTPUT_DIR}/${PACKAGE_NAME}.tar.gz"
            tar -czf "${ASSET_PATH}" -C "${OUTPUT_DIR}/staging" "${PACKAGE_NAME}"
          else
            echo "::error::Unsupported runner OS: ${RUNNER_OS}"
            exit 1
          fi

          CHECKSUM_PATH="${ASSET_PATH}.sha256"
          (
            cd "$(dirname "${ASSET_PATH}")"
            cmake -E sha256sum "$(basename "${ASSET_PATH}")" > "$(basename "${CHECKSUM_PATH}")"
          )

          if [[ ! -s "${ASSET_PATH}" || ! -s "${CHECKSUM_PATH}" ]]; then
            echo "::error::Package output validation failed for ${PACKAGE_NAME}."
            exit 1
          fi
          if [[ ! -f "${STAGING_DIR}/TROUBLESHOOTING.md" ]]; then
            echo "::error::Package staging is missing TROUBLESHOOTING.md."
            exit 1
          fi

          {
            echo "asset_name=${PACKAGE_NAME}"
            echo "asset_path=dist/$(basename "${ASSET_PATH}")"
            echo "checksum_path=dist/$(basename "${CHECKSUM_PATH}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

  build-windows-mingw:
    needs: [prepare]
    # OpenAL Soft 1.25 requires the C++20 <format> implementation provided by
    # Noble's MinGW GCC 13 toolchain (Jammy ships MinGW GCC 10).
    runs-on: ubuntu-24.04
    env:
      GIT_DESCRIBE: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux and MinGW dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            g++-mingw-w64 \
            gcc-mingw-w64 \
            git \
            libglib2.0-dev \
            libgtk-3-dev \
            libsdl2-dev \
            libvpx-dev \
            libwebp-dev \
            mingw-w64 \
            nasm \
            ninja-build \
            pkg-config

      - name: Ensure vcpkg checkout
        shell: bash
        run: |
          set -euo pipefail

          VCPKG_COMMIT="$(git ls-tree HEAD vcpkg | awk '{print $3}')"
          if [[ ! -d vcpkg/.git || ! -f vcpkg/scripts/buildsystems/vcpkg.cmake ]]; then
            rm -rf vcpkg
            git clone https://github.com/microsoft/vcpkg.git vcpkg
            if [[ -n "${VCPKG_COMMIT}" ]]; then
              git -C vcpkg checkout "${VCPKG_COMMIT}"
            fi
          fi

      - name: Cache vcpkg MinGW build products
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
            build-windows-mingw/vcpkg_installed
          key: ${{ runner.os }}-release-mingw-vcpkg-${{ hashFiles('vcpkg.json', 'cmake/toolchains/mingw-w64-x86_64.cmake', 'tools/build-windows-mingw.sh') }}
          restore-keys: |
            ${{ runner.os }}-release-mingw-vcpkg-

      - name: Build and package Windows x64 MinGW
        shell: bash
        run: |
          ./tools/build-windows-mingw.sh --package --jobs 3

      - name: Upload MinGW package artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiasedDoom-${{ needs.prepare.outputs.version }}-Windows-x64-MinGW
          path: |
            artifacts/BiasedDoom-${{ needs.prepare.outputs.version }}-Windows-x64-MinGW.zip
            artifacts/BiasedDoom-${{ needs.prepare.outputs.version }}-Windows-x64-MinGW.zip.sha256
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version)
    needs: [prepare, build-and-package, build-windows-mingw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: BiasedDoom-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          NOTES_FILE="release-notes.md"

          NOTES=""
          CHANGELOG_SECTION="$(awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" {found = 1; next}
            found && $0 ~ "^## \\[" {found = 0}
            found {print}
          ' CHANGELOG.md || true)"

          if [[ -z "${CHANGELOG_SECTION}" ]]; then
            CHANGELOG_SECTION="$(awk '
              /^## \[Unreleased\]/ {found = 1; next}
              found && /^## \[/ {found = 0}
              found {print}
            ' CHANGELOG.md || true)"
          fi

          if [[ -n "${CHANGELOG_SECTION}" ]]; then
            NOTES="${CHANGELOG_SECTION}"
          else
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [[ -n "${PREVIOUS_TAG}" ]]; then
              NOTES="$(git log --no-merges --pretty='- %s' "${PREVIOUS_TAG}..${TAG}")"
            else
              NOTES="$(git log --no-merges --pretty='- %s' -n 20)"
            fi
          fi

          {
            echo "# BiasedDoom ${VERSION}"
            echo
            if [[ -n "${NOTES}" ]]; then
              echo "${NOTES}"
            else
              echo "- Release artifacts built from tag ${TAG}."
            fi
            echo
            echo "## Downloads"
            echo
            echo "- Linux: download the \`.AppImage\`, mark it executable if needed, and run it. AppImages need FUSE 2 (\`libfuse2\` on Ubuntu 22.04, \`libfuse2t64\` on Ubuntu 24.04); use \`APPIMAGE_EXTRACT_AND_RUN=1\` on minimal systems without FUSE."
            echo "- Windows: download the \`Windows-x64.zip\`, extract it, and run \`biaseddoom.exe\`."
            echo "- Windows MinGW: download the \`Windows-x64-MinGW.zip\` if you want the Linux-built cross-compiled package."
            echo
            echo "SHA256 checksum files are published beside each artifact."
          } > "${NOTES_FILE}"

          echo "path=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: BiasedDoom ${{ needs.prepare.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: ${{ needs.prepare.outputs.draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: release-assets/**
